<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura Twin | Solicitar Captura 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .cyber-grid {
            background-image: linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between cyber-grid selection:bg-cyan-500 selection:text-slate-950">

<!-- Header -->
<header class="px-6 py-6 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-5 h-5 border-2 border-cyan-400 rotate-45 relative flex items-center justify-center">
                <div class="w-2 h-2 bg-blue-500 -top-1 -right-1 absolute"></div>
            </div>
            <div class="flex items-center font-black text-xl tracking-widest uppercase">
                <span class="text-slate-200">NE</span>
                <span class="text-cyan-400 text-2xl font-black -mx-0.5 inline-block transform -rotate-3">X</span>
                <span class="text-slate-200">URA</span>
                <span class="text-cyan-400 ml-2 font-bold">TWIN</span>
            </div>
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition-colors">← Volver al inicio</a>
    </div>
</header>

<!-- Formulario Principal -->
<main class="max-w-2xl mx-auto px-6 py-12 my-auto w-full">
    <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-2xl backdrop-blur relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="mb-8">
            <span class="text-xs uppercase font-mono tracking-widest text-cyan-400 block mb-2">Solicitud de Inspección & Levantamiento 3D</span>
            <h1 class="text-3xl font-serif-title font-bold text-slate-100">Captura de Fábrica o Inmueble</h1>
            <p class="text-slate-400 text-xs mt-2">Ingresa los datos corporativos para programar el escaneo láser y levantamiento del gemelo digital.</p>
        </div>

        <!-- El formulario enviará la información a través de Formspree -->
        <form action="https://formspree.io/f/REEMPLAZAR_CON_TU_ID" method="POST" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1">Nombre de la Empresa *</label>
                    <input type="text" name="empresa" required placeholder="Ej: Haceb S.A." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1">NIT o Identificación Fiscal *</label>
                    <input type="text" name="nit" required placeholder="Ej: 900.123.456-7" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1">Correo Electrónico Corporativo *</label>
                    <input type="email" name="email" required placeholder="CONTACTNEXURATWIN@nexuratwin.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1">Número de Teléfono / WhatsApp *</label>
                    <input type="tel" name="telefono" required placeholder="+57 300 123 4567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-mono text-slate-400 mb-1">Ubicación & Detalles de la Infraestructura</label>
                <textarea name="detalles" rows="4" placeholder="Ciudad, área aproximada en m², tipo de planta o requerimientos de remodelación..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors"></textarea>
            </div>

            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-cyan-500/20">
                Enviar Solicitud de Captura →
            </button>
        </form>
    </div>
</main>

<footer class="py-6 text-center text-xs text-slate-600 border-t border-slate-800/40">
    © 2026 Nexura Twin S.A.S. Todos los derechos reservados.
</footer>
</body>
</html>
