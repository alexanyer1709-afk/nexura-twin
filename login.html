<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura Twin | Acceso Maestro & Portal OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 selection:bg-cyan-500 selection:text-slate-950">

<div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
    <!-- Glow estético -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>

    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-400 text-3xl mb-4 shadow-lg shadow-cyan-500/20">
            📦
        </div>
        <div class="flex items-center justify-center space-x-2">
            <span class="text-xl font-black tracking-tight text-blue-500">NEXURA</span>
            <span class="text-xl font-black tracking-tight text-cyan-400">TWIN</span>
        </div>
        <p class="text-slate-400 text-xs mt-1">Plataforma de Autenticación & Control OS</p>
    </div>

    <!-- Formulario de Acceso -->
    <form id="login-form" class="space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Empresa / Cliente</label>
            <input type="text" id="company" required placeholder="Ej: Haceb" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuario Master</label>
            <input type="text" id="username" required placeholder="admin@empresa.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
        </div>

        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-cyan-500/20 transition-all duration-200">
            Ingresar al Portal 3D
        </button>
    </form>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        // Redirecciona a la aplicación principal
        window.location.href = 'app.html';
    });
</script>
</body>
</html>
