<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura Twin | Acceso Maestro & Portal OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 selection:bg-cyan-500 selection:text-slate-950">

<div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
    <!-- Detalle estético con el avatar de Nexi -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>

    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-400 text-3xl mb-4 shadow-lg shadow-cyan-500/20">
            🦦
        </div>
        <div class="flex items-center justify-center space-x-2">
            <span class="text-xl font-black tracking-tight text-blue-500">NEXURA</span>
            <span class="text-xl font-black tracking-tight text-cyan-400">TWIN</span>
        </div>
        <p class="text-slate-400 text-xs mt-1">Plataforma de Autenticación & Control OS</p>
    </div>

    <form id="form-login" class="space-y-5">
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Correo Electrónico</label>
            <input type="email" id="login-email" required placeholder="admin@nexuratwin.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Contraseña de Acceso</label>
            <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 text-sm transition">
            Iniciar Sesión en el Sistema →
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800 text-center">
        <a href="index.html" class="text-xs text-slate-400 hover:text-cyan-400 transition">← Volver al sitio web público</a>
    </div>
</div>

<script>
    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        let email = document.getElementById('login-email').value.trim();
        let pass = document.getElementById('login-pass').value.trim();

        // Credenciales por defecto del Super Administrador (Tú)
        if (email === "admin@nexuratwin.com" && pass === "Admin2026*") {
            localStorage.setItem('nexura_sesion_activa', JSON.stringify({ rol: 'superadmin', email: email }));
            alert('¡Bienvenido, Jefe! Acceso concedido al panel maestro.');
            window.location.href = 'admin.html';
            return;
        }

        // Buscar si es una empresa registrada previamente en el admin
        let empresas = JSON.parse(localStorage.getItem('nexura_pro_empresas') || '[]');
        let empresaEncontrada = empresas.find(e => e.email === email && e.pass === pass);

        if (empresaEncontrada) {
            if (!empresaEncontrada.activo) {
                alert('Acceso denegado: La membresía de esta empresa se encuentra bloqueada por falta de pago.');
                return;
            }
            localStorage.setItem('nexura_sesion_activa', JSON.stringify({ rol: 'cliente', empresa: empresaEncontrada.nombre, email: email }));
            alert(`¡Bienvenido a tu portal, ${empresaEncontrada.nombre}!`);
            window.location.href = 'app.html';
            return;
        }

        alert('Correo o contraseña incorrectos. Si acabas de registrar una empresa, usa el correo y clave que asignaste en el panel.');
    });
</script>
</body>
</html>
